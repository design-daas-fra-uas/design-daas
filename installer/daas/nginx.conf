# /etc/nginx/nginx.conf, installed by daas/configure.bash (replaces Debian's).
# The sites are in sites-enabled/: daas.conf (DaaS backend, :443) and
# frontend.conf (frontend + auth service, :8443).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	# Long timeouts: desktop sessions are websockets that stay open for hours,
	# uploads/downloads can be large
	proxy_send_timeout 1800;
	proxy_read_timeout 1800;
	proxy_connect_timeout 1800;
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;
	gzip on;

	# DaaS backend (src/main.py, TLS on 127.0.0.1:5000)
	upstream upstream_back {
		server 127.0.0.1:5000;
	}
	# Frontend container (daas-frontend)
	upstream upstream_front {
		server 127.0.0.1:5001;
	}

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
