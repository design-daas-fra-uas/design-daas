# Who may log in (copied into the data directory on its first start, see
# Dockerfile). The first matching line wins.
#
# TYPE  DATABASE  USER  ADDRESS          METHOD
# Inside the container (docker exec ... psql -U postgres): only root and the
# docker group can get there
local   all       all                    trust
# The docker host: the DaaS backend and the auth service through the
# published 127.0.0.1:5432
host    all       all   172.17.0.1/32    scram-sha-256
# Everyone else, e.g. user instances on the docker bridge
host    all       all   0.0.0.0/0        reject
host    all       all   ::/0             reject
