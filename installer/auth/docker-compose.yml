# auth service (users, OAuth tokens, permissions).
#
# Its data lives in the DaaS PostgreSQL (daas-0-postgres, installer/postgres),
# database AUTH_DB_NAME next to the DaaS backend's mergedb; auth/install.bash
# creates the database and its user there.
#
# Values come from installer/auth/.env, which auth/install.bash generates
# from installer/daas.env. Started by daas-auth.service.
#
#   docker-compose --env-file .env -f docker-compose.yml ps|logs -f

name: daas-auth

services:
  backend:
    build:
      context: ${AUTH_FOLDER}
    image: daas-auth
    container_name: daas-auth
    restart: unless-stopped
    # Host network: reaches the DaaS PostgreSQL on its published 127.0.0.1:5432.
    # Until that runs (the DaaS backend starts it) the app exits and docker
    # restarts it.
    network_mode: host
    environment:
      # Only reachable from this host: nginx (/auth/) and the DaaS backend
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: ${AUTH_PORT}
      SPRING_PROFILES_ACTIVE: ${AUTH_PROFILE}
      DB_URL: jdbc:postgresql://127.0.0.1:5432/${AUTH_DB_NAME}
      DB_USERNAME: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      # Create ADMIN_EMAIL on the first start (the prod profile turns this
      # off by default); skipped once the account exists
      ADMIN_INIT_ENABLED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OAUTH_KEYS_DIR: /app/keys
      OAUTH_ISSUER: ${AUTH_PUBLIC_URL}
      OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${OAUTH_ACCESS_TOKEN_TTL_SECONDS}
      OAUTH_REFRESH_TOKEN_TTL_DAYS: ${OAUTH_REFRESH_TOKEN_TTL_DAYS}
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_PUBLIC_URL}
      # nginx connects from 127.0.0.1, so trust X-Forwarded-For from there
      # (needed for per-client rate limits)
      RATE_LIMIT_TRUSTED_PROXIES: 127.0.0.1/32,::1/128
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    volumes:
      # RSA keys for signing tokens; kept so tokens survive restarts
      - keys:/app/keys

volumes:
  keys:
