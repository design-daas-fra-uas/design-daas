# Frontend (React build in the daas-frontend container) on :8443, plus the
# Java backend under /auth/. Installed by frontend/configure.bash, which
# replaces front1.cluster.local and the Java port (127.0.0.1:8080).
server {
    listen 8443 ssl;
    server_name front1.cluster.local;

    # SSL certificate and key paths
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Java backend (users, OAuth tokens, permissions). Same origin as the
    # frontend, so the browser needs no CORS for it.
    location /auth/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot fake their IP for the
        # Java rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /auth;
    }

    location / {
        proxy_pass http://upstream_front/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
