# Local file storage. Read by FilePlugin -> FilestoreConfig
# (app/daas/storage/local/fs_config.py). Paths are relative to src/.

[filestore]
folder_tmp = "data/tmp"
folder_shared = "data/shared"
folder_upload = "data/upload"
folder_docker = "data/docker"
# JSON files describing endpoint permission groups (*.json with "endpoints")
folder_endpoint_info = "data/endpoint_info"

# Folder names inside an instance
folder_inst_status = "status"
instance_status_outfile_name = "cmdout.txt"
