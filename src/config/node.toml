# Host helpers (DHCP entries, iptables, local SSH). Read by NodePlugin ->
# NodeControllerConfig (app/daas/node/nodecontrol.py) / SshAdapterConfig.

[host_dns]
# The MAC prefix of the VMs is vm.toml [vm_api] prefixmac.
# Fixed DHCP entries per VM: created by installer/daas/configure.bash,
# one line added by the backend for every VM it starts, read by dnsmasq
dnsmasqhosts = "/etc/dnsmasq.d/pve-hosts.conf"

[host_ssh]
# SSH to the host itself for privileged commands
sshuser = "root"
sshhost = "localhost"
sshport = 22
# Seconds
sshopt_timeout = 1
sshopt_strictcheck = "no"
sshopt_nohostauth = "yes"
logcmd = true
logresult = false
