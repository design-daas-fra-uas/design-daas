# Docker. Read by ContainerPlugin -> DockerRequestConfig / DockerServicesConfig
# (app/daas/container/docker/DockerRequest.py).

[container_request]
# Address of the host on vmbr0 as seen by containers.
# Default only: the installer writes the host value to config/local/ (see README.md)
host = "192.168.123.11"
# Wait after starting the service containers (ms, 0 = no wait)
wait_services_ms = 0
logrequest = true

[service_containers]
# Containers the backend (re)starts on startup and stops on shutdown.
# Each entry: [IMAGE, CONTAINER_NAME, [OPTIONS], CPUS, MEMORY_BYTES]
# OPTIONS understood: "-p HOST:PORT:PORT", "-v HOSTPATH:PATH:MODE"
# (relative HOSTPATH = src/data/...), "--privileged".
# The images are built by `make containers-install` in installer/.
service_containers = [
  # Guacamole daemon (VNC/RDP -> browser)
  [
    "daas-0-guacd",
    "daas-0-guacd",
    ["-p 127.0.0.1:4822:4822"],
    2,
    2147483648,  # 2 GiB
  ],
  # PostgreSQL (db.toml db_type = "postgres"), also the auth service's
  # database (installer/postgres)
  [
    "daas-0-postgres",
    "daas-0-postgres",
    [
      "-p 127.0.0.1:5432:5432",
      "-v db/postgres:/var/lib/postgresql:rw",
    ],
    2,
    2147483648,  # 2 GiB
  ],
  # RabbitMQ for the instance agents, bound to the docker0 address
  [
    "daas-0-rabbit",
    "daas-0-rabbit",
    [
      "-p 172.17.0.1:5672:5672",
    ],
    2,
    2147483648,  # 2 GiB
  ],
  # Extensions: CUPS (631) and printer websocket (8010), reached on the
  # container's own IP (extensions.toml service_ip); no host ports, so they
  # never clash with a CUPS on the host
  [
    "daas-0-extensions",
    "daas-0-extensions",
    [],
    2,
    2147483648,  # 2 GiB
  ],
]
