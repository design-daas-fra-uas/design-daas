# Docker. Read by ContainerPlugin -> DockerRequestConfig / DockerServicesConfig
# (app/daas/container/docker/DockerRequest.py).

[container_request]
# Address of the host on vmbr0 as seen by containers.
# Set by installer/daas/configure.bash
host = "192.168.123.11"
# Wait after starting the service containers (ms, 0 = no wait)
wait_services_ms = 0
logrequest = true

[service_containers]
# Containers the backend (re)starts on startup and stops on shutdown.
# Each entry: [IMAGE, CONTAINER_NAME, [OPTIONS], CPUS, MEMORY_BYTES]
# OPTIONS understood: "-p HOST:PORT:PORT", "-v HOSTPATH:PATH:MODE"
# (relative HOSTPATH = src/data/...), "--privileged".
# The images are built by `make daas-services` in installer/.
service_containers = [
  # Guacamole daemon (VNC/RDP -> browser)
  [
    "daas-0-guacd",
    "daas-0-guacd",
    ["-p 127.0.0.1:4822:4822"],
    2,
    2147483648,  # 2 GiB
  ],
  # MariaDB (only used when db.toml db_type = "mariadb")
  [
    "daas-0-mariadb",
    "daas-0-mariadb",
    [
      "-p 127.0.0.1:3306:3306",
      "-v db/mariadb:/var/lib/mysql:rw",
    ],
    2,
    2147483648,  # 2 GiB
  ],
  # RabbitMQ for the instance agents, bound to the docker0 address
  [
    "daas-0-rabbit",
    "daas-0-rabbit",
    [
      "-p 172.17.0.1:5672:5672",
    ],
    2,
    2147483648,  # 2 GiB
  ],
  # Extensions: CUPS (631), printer websocket (8010)
  [
    "daas-0-extensions",
    "daas-0-extensions",
    [
      "-p 127.0.0.1:631:631",
      "-p 127.0.0.1:8010:8010",
    ],
    2,
    2147483648,  # 2 GiB
  ],
]
