# Resource limits. Read by LimitPlugin -> RessourceLimitsConfig
# (app/daas/resources/limits/ressource_limits.py).
# Memory and disk are in bytes.

[limits]
# Allow starting even if a limit would be exceeded
enable_overcommit = true
# Use the flb_* limits for users without their own limit entry
enable_fallback_userlimit = true
log_verification = true

# System-wide maximum
sys_max_vms = 10
sys_max_img = 100
sys_max_obj = 110
sys_cpu_max = 60
sys_mem_max = 28884901888    # ~26.9 GiB
sys_dsk_max = 674877906944   # ~628.5 GiB

# Fallback limits per user
flb_max_vms = 10
flb_max_img = 10
flb_max_obj = 20
flb_cpu_max = 20
flb_mem_max = 18884901888    # ~17.6 GiB
flb_dsk_max = 474877906944   # ~442.3 GiB
