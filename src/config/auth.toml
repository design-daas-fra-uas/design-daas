# Authentication. Read by AuthPlugin -> QwebAuthenticatorConfig
# (app/qweb/common/config.py).

[auth]
# "local": every request runs as [auth.local] default user
# "remote": tokens are checked against the OAuth backend in [auth.remote]
authenticator_type = "remote"
enable_auth_user = true
enable_auth_token = true
enable_auth_endpoint = false
# Check that loaded objects belong to the requesting user
enable_entity_verification = true
enable_verify_tls = false
enable_logging = false
enable_log_entity_verification = false
enable_log_requests = false
enable_log_results = false

[auth.local]
default_userid = 5
default_username = "default_user"

[auth.remote]
url = "http://127.0.0.1:8080"
clientid = "test-client"
scope = "admin"
username = "admin@design.local"
password = ""  # set by the installer in config/local/auth.toml (not in git)
