[project]
name = "app"
dependencies = [
  "Quart==0.22.0",
  "quart-cors==0.8.0",
  "requests==2.34.2",
  "aiohttp==3.14.5",
  "websockets==17.4",
  "pika==1.4.4",
  "netifaces==0.11.0",
  "psutil==7.2.2",
  "SQLAlchemy==2.1.8",
  "PyMySQL==1.2.3",
  "aiosqlite==0.22.1",
  "docker==7.2.0",
]
description = "Design quart app"
requires-python = ">=3.11"
version = "2.0.0"

[project.optional-dependencies]
dev = [
  "flake8==7.5.0",
  "pylint==4.1.3",
  "pylint-per-file-ignores==4.0.0",
  "black==26.10.1",
  "types-requests==2.33.0.20261030",
  "types-click==7.1.8",
  "types-aiofiles==25.1.0.20261107",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pyright]
venvPath = ".venv"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
check_untyped_defs = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["docker.*", "hypothesis.*", "pytest.*"]
ignore_missing_imports = false
